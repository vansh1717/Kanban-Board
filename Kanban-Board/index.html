<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban Board</div>
            <div class="right"><button id="toggle-modal">+ Add task</button></div>
        </nav>
        <section class="board">
            <div id="todo" class="task-clm">
                <div class="heading">
                    <div class="left">TO DO</div>
                    <div class="right"><span id="todo-count">0</span></div>
                </div>
                <!-- <div draggable="true" class="task">
                    <h3>Task 1</h3>
                    <p>Description for task</p>
                    <button>Delete</button>
                </div> -->
            </div>

            <div id="progress" class="task-clm " >
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right"><span id="progress-count">0</span></div>
                </div>
            </div>

            <div id="done" class="task-clm">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right"><span id="done-count">0</span></div>
                </div>
            </div>

        </section>
    </main>

    <div class="modal  add-new-task">
        <div class="bg"> </div>
        <div class="center">
            <input type="text" placeholder="add Title">
            <textarea name="" id="" placeholder="so kya krna hai"></textarea>
            <button id="add-new-task" class="add-task-btn">Add</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
